name: build

# La acción se va a correr ante un 'push' o 'pull request' en cualquier rama con cambios.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest # Verificar que corra en Ubuntu es suficiente.
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 23+
      uses: actions/setup-java@v5.7.0
      with:
        java-version: '23.0.2+7'
        distribution: 'temurin'
        cache: maven
    - name: Set up Maven version
      uses: stCarolas/setup-maven@v5.1
      with:
        maven-version: 3.9.16
    - name: Build with Maven
      run: xvfb-run mvn -B package --file pom.xml